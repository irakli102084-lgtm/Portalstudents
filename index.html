<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>სტუდენტის პორტალი</title>
  
  <!-- მეტა ტეგები გაზიარებისთვის (Open Graph) -->
  <meta property="og:title" content="სტუდენტების აკადემიური პორტალი">
  <meta property="og:description" content="საზოგადოებრივი კოლეჯი კავკასიონი">
  <meta property="og:image" content="https://kavkasioni.edu.ge/wp-content/uploads/2021/10/logo-300x300.jpg">
  <meta property="og:type" content="website">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Serif Georgian', 'Sylfaen', serif; background-color: #f4f7f9; padding: 20px; color: #333; margin: 0; }
    .container { max-width: 650px; margin: auto; background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    .header { text-align: center; margin-bottom: 30px; }
    .logo-img { max-width: 150px; height: auto; margin-bottom: 15px; }
    .college-name { font-size: 1.1em; color: #555; font-weight: 700; margin-bottom: 5px; }
    .portal-title { font-size: 1.4em; color: #2c3e50; font-weight: bold; margin-top: 5px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    input { flex: 1; padding: 14px; border: 2px solid #e1e4e8; border-radius: 12px; font-size: 16px; outline: none; }
    button { padding: 14px 25px; background: #e74c3c; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; font-family: inherit; }
    .student-card { background: #2c3e50; color: white; padding: 20px; border-radius: 15px; margin-bottom: 25px; display: none; text-align: center; }
    .sem-block { margin-top: 20px; border: 1px solid #eee; border-radius: 15px; overflow: hidden; background: #fff; }
    .sem-header { background: #f8f9fa; padding: 12px 20px; font-weight: bold; border-bottom: 1px solid #ddd; }
    .mod-item { display: flex; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid #eee; }
    .status-yes { color: #e74c3c; font-weight: bold; }
    .status-dash { color: #bbb; }
    #loading { display: none; text-align: center; margin: 15px 0; }
    .error { color: #e74c3c; text-align: center; display: none; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://kavkasioni.edu.ge/wp-content/uploads/2021/10/logo-300x300.jpg" class="logo-img">
      <div class="college-name">საზოგადოებრივი კოლეჯი „კავკასიონი“</div>
      <div class="portal-title">სტუდენტების აკადემიური პორტალი</div>
    </div>
    <div class="search-box">
      <input type="text" id="code" placeholder="შეიყვანეთ კოდი...">
      <button onclick="search()">ძებნა</button>
    </div>
    <div id="loading">მიმდინარეობს ძებნა...</div>
    <div id="error" class="error">სტუდენტი ვერ მოიძებნა</div>
    <div id="resultArea">
      <div id="card" class="student-card">
        <h3 id="n"></h3>
        <p id="p"></p>
      </div>
      <div id="semesters"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzlPk-nU_DcBdslP_sO4-k-G_fe7dxSoGOHeiCCR1vfDYeueCxpegyZcVkkl__4QyQwxA/exec";

    function search() {
      const code = document.getElementById('code').value.trim();
      if (!code) return;

      document.getElementById('loading').style.display = 'block';
      document.getElementById('error').style.display = 'none';
      document.getElementById('semesters').innerHTML = '';
      document.getElementById('card').style.display = 'none';

      fetch(`${API_URL}?code=${code}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('loading').style.display = 'none';
          if (data.found) {
            document.getElementById('n').innerText = data.name;
            document.getElementById('p').innerText = data.program;
            document.getElementById('card').style.display = 'block';
            data.semesters.forEach(s => {
              let b = document.createElement('div');
              b.className = 'sem-block';
              b.innerHTML = `<div class="sem-header">${s.title}</div>`;
              s.modules.forEach(m => {
                let i = document.createElement('div');
                i.className = 'mod-item';
                let st = m.status === 'დიახ' ? '<span class="status-yes">დიახ</span>' : '<span class="status-dash">____</span>';
                i.innerHTML = `<span>${m.moduleName}</span>${st}`;
                b.appendChild(i);
              });
              document.getElementById('semesters').appendChild(b);
            });
          } else {
            document.getElementById('error').style.display = 'block';
          }
        });
    }
  </script>
</body>
</html>
